# docker compose = "run these containers together, with this configuration".
#
#   docker compose up                                   # API on localhost:9292
#   docker compose run --rm api bundle exec rake test   # run the tests
#   docker compose exec api bin/prompt-lab              # evaluate prompts against the configured AI
#   docker compose --profile ollama up -d               # also start a local AI in a container
services:
  api:
    build: .
    ports:
      - "9292:9292"          # your machine's port : the container's port
    env_file: .env           # LLM_PROVIDER, keys, OLLAMA_URL...
    volumes:
      - .:/app               # your code is mounted live (no rebuild after code changes)
    extra_hosts:
      # Lets the container reach services on YOUR machine (e.g. Ollama installed
      # locally) at http://host.docker.internal:<port>. Needed on Linux.
      - "host.docker.internal:host-gateway"

  # Optional: local AI in a container. Only starts with --profile ollama.
  # Use OLLAMA_URL=http://ollama:11434 with this one.
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama   # downloaded models survive container restarts

volumes:
  ollama-models:
