# Copy to config/profile.yml and fill it FROM YOUR RESUME: the resume is the source of
# truth, and every highlight must be something it actually says. This drives comment
# suggestions, post generation and feed ranking.
name: Pedro Barbosa
headline: UX Engineer & Designer
language: en-US           # fallback: comments follow each post's language; posts use this one
tone: direct, curious and jargon-free

# The ONLY experience the AI may cite. Without these it invents projects and numbers.
highlights:
  - 5+ years in backend development with Ruby on Rails and Java
  - Built asynchronous integrations with RabbitMQ
  - Currently studying UX/UI Design in a co-op program

# The jobs you want to apply for. `terms` are the words recruiters actually use;
# a post that mentions any term matches the target. Matching ignores case and accents.
job_targets:
  - name: UI/UX Design
    terms: [ui/ux, ux/ui, ux designer, ui designer, product designer, ux engineer, ux design, ui design]
  - name: Co-op
    terms: [coop, co-op student, internship, intern, work term, estágio]
  - name: Developer
    terms: [front-end developer, frontend developer, front-end engineer, web developer, software developer, react developer]

# Topics you want to be seen with (interests, not claims). Each one in a post adds to its score.
keywords:
  - design system
  - accessibility
  - React
  - Figma
  - Ruby on Rails
